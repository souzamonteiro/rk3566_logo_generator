# This is a workflow that is manually triggered to build an Image with an updated logo for dArkOS and ArkOS on supported RK3566 devices

name: dArkOS Kernel with Logo Generator

on:
  workflow_dispatch:
    inputs:
      device_unit:
        type: choice
        description: 'Choose your device'
        required: true
        options:
        - MiniLoong
        - RG353
        - RG503
        - RGB30
        - RGB20PRO
        - RK2023
      picture_link:
        description: 'HTML link OR repository-relative path to your png file (e.g. samples/logo-rg353.png)'
        required: true
      update_hdmi:
        type: choice
        description: 'Would you like to update the hdmi out logo as well?'
        required: false
        options:
        - Nope
        - Yep
      hdmi_picture_link:
        description: 'HTML link OR repository-relative path to your png file for hdmi out'
        required: false
jobs:
  # This workflow contains a single job.
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: checkout_repo
      uses: actions/checkout@v6
      with:
        ref: ${{ github.ref_name }}
        fetch-depth: 1
    - name: checkout kernel repo selected
      id: Build_kernel_with_new_logo
      shell: bash {0}
      run: |

        PICTURE_INPUT="${{ github.event.inputs.picture_link }}"
        HDMI_INPUT="${{ github.event.inputs.hdmi_picture_link }}"

        # Verify primary input is either a PNG path in repo, a direct PNG URL, or an ibb/pasteboard page URL.
        if [[ ! -f "$PICTURE_INPUT" ]] && [[ "$PICTURE_INPUT" != *.png ]] && [[ "$PICTURE_INPUT" != *.PNG ]] && [[ "$PICTURE_INPUT" != *"ibb.co"* ]] && [[ "$PICTURE_INPUT" != *"pasteboard.co"* ]]; then
          echo "::error::Input must be a .png URL or a repository file path to a .png"
          exit 1
        fi

        # Install necessary kernel building and logo processing tools
        sudo apt -y update
        sudo apt -y install build-essential git lzop build-essential gcc bc libncurses5-dev libc6-i386 lib32stdc++6 zlib1g netpbm imgp

        # Clone the correct kernel repo for this kernel build
        git clone --recursive --depth=1 https://github.com/christianhaitian/kernel_5_10_226.git

        # Install the necessary toolchain for building the kernel
        mkdir -p /opt/toolchains/gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu
        git clone --depth=1 https://github.com/christianhaitian/gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu.git /opt/toolchains/gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export PATH=/opt/toolchains/gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu/bin/:$PATH
        cd kernel_5_10_226

        fetch_logo() {
          local input="$1"
          local output="$2"
          local label="$3"

          if [[ -f "$input" ]]; then
            cp -f "$input" "$output"
            return 0
          fi

          if [[ "$input" == *"pasteboard.co"* ]]; then
            wget -t 3 -T 60 --no-check-certificate "$input" -O "${label}.txt"
            real_logo="$(grep 'img data-src="' "${label}.txt" | cut -d '"' -f 2)"
            wget -t 3 -T 60 --no-check-certificate "${real_logo}" -O "$output"
          elif [[ "$input" == *"ibb.co"* ]]; then
            wget -t 3 -T 60 --no-check-certificate "$input" -O "${label}.txt"
            real_logo="$(grep 'og:image" content="' "${label}.txt" | cut -d '"' -f 4)"
            wget -t 3 -T 60 --no-check-certificate "${real_logo}" -O "$output"
          else
            wget -t 3 -T 60 --no-check-certificate "$input" -O "$output"
          fi
        }

        fetch_logo "$PICTURE_INPUT" logo.png logo || {
          echo "::error::Failed to get $PICTURE_INPUT"
          exit 1
        }

        if [[ -n "$HDMI_INPUT" ]]; then
          if [[ ! -f "$HDMI_INPUT" ]] && [[ "$HDMI_INPUT" != *.png ]] && [[ "$HDMI_INPUT" != *.PNG ]] && [[ "$HDMI_INPUT" != *"ibb.co"* ]] && [[ "$HDMI_INPUT" != *"pasteboard.co"* ]]; then
            echo "::error::HDMI input must be a .png URL or a repository file path to a .png"
            exit 1
          fi

          fetch_logo "$HDMI_INPUT" hdmi_logo.png hdmi_logo || {
            echo "::error::Failed to get $HDMI_INPUT"
            exit 1
          }
        fi

        # Process the downloaded logo into the format necessary for the kernel
        pngtopnm logo.png | ppmquant 224 | pnmnoraw > drivers/video/logo/logo_linux_clut224.ppm
        if [ "$?" != "0" ]; then
          echo "::error::${{ github.event.inputs.picture_link }} is not a compatible png file for the boot logo"
          exit 1
        fi
        if [[ "${{ github.event.inputs.update_hdmi }}" == "Yep" ]]; then
          if [ -f "hdmi_logo.png" ]; then
            pngtopnm hdmi_logo.png | ppmquant 224 | pnmnoraw > drivers/video/logo/logo_hdmi_clut224.ppm
            if [ "$?" != "0" ]; then
              echo "::error::${{ github.event.inputs.hdmi_picture_link }} is not a compatible png file for the boot logo"
              exit 1
            fi
          else
            imgp -nx 1280x720 logo.png
            pngtopnm logo_IMGP.png | ppmquant 224 | pnmnoraw > drivers/video/logo/logo_hdmi_clut224.ppm
            if [ "$?" != "0" ]; then
              echo "::error::${{ github.event.inputs.picture_link }} is not a compatible png file for the hdmi output logo"
              exit 1
            fi
          fi
        fi

        # If no errors, let's build the kernel and make it available as an artifact if successful
        make ARCH=arm64 rk3566_optimized_linux_defconfig
        CFLAGS=-Wno-deprecated-declarations make -j2 ARCH=arm64 KERNEL_DTS=rk3566 KERNEL_CONFIG=rk3566_optimized_linux_defconfig
        cp arch/arm64/boot/Image ../.
    - name: Get kernel artifact
      uses: actions/upload-artifact@v7
      with:
        name: image_${{ github.event.inputs.device_unit }}
        path: Image
